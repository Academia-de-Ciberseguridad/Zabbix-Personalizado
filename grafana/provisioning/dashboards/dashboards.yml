# Carga automática de los dashboards en JSON de /var/lib/grafana/dashboards
apiVersion: 1

providers:
  - name: Academia
    orgId: 1
    folder: Academia Ciberseguridad
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
