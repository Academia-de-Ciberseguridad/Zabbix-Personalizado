# ---------------------------------------------------------------------------
#  Config adicional del agente "srv-web"  (endurecido)
#  Se incluye desde /etc/zabbix/zabbix_agent2.d/  (ver Include del agente).
# ---------------------------------------------------------------------------

# --- Refuerzo defensivo (redundante con ZBX_DENYKEY del compose) -----------
# Aunque el compose ya inyecta DenyKey, lo dejamos explícito como documentación
# viva: el agente NUNCA debe poder ejecutar comandos arbitrarios del sistema.
DenyKey=system.run[*]

# --- UserParameters SEGUROS ------------------------------------------------
# Métrica de aplicación: nº de conexiones ESTABLISHED (sin argumentos del
# usuario que lleguen a la shell -> no hay inyección posible).
UserParameter=app.tcp.established,netstat -ant 2>/dev/null | grep -c ESTABLISHED

# Nº de procesos en ejecución (indicador de salud del contenedor).
UserParameter=app.proc.count,ps -e 2>/dev/null | wc -l

# ---------------------------------------------------------------------------
#  ⚠ LECCIÓN DE SEGURIDAD (ver docs/04-superficie-ataque.md)
#  Un UserParameter con [*] que pase $1 directamente a la shell es una puerta
#  trasera de ejecución remota. EJEMPLO DE LO QUE NO SE DEBE HACER:
#     UserParameter=cmd[*],$1
#  Con eso, cualquiera que alcance el agente ejecuta:  zabbix_get -k 'cmd[id]'
#  Aquí NO lo definimos: este agente es el ejemplo correcto.
# ---------------------------------------------------------------------------
